[package]
name = "elearnin"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "~1.18.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
slint-build = "~1.18.0"
winresource = "0.1.31"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
slint = { version = "~1.18.0", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
