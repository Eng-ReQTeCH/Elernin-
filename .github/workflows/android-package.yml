name: Android package

on:
  workflow_dispatch:
  push:
    branches: [android-packaging]
    paths:
      - '.github/workflows/android-package.yml'
      - 'packaging/android/**'
      - 'Cargo.*'
      - 'src/**'
      - 'ui/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk-r28
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk --platform 26 -t arm64-v8a -t x86_64 -o target/android-libs build --release --lib --locked
          gradle --no-daemon -p packaging/android assembleRelease assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 packaging/android/build/outputs/apk/release/*-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash packaging/android/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: elearnin-android-unsigned
          path: packaging/android/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
